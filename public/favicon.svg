<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="42" fill="url(#grad)" />
  <circle cx="50" cy="50" r="36" fill="white" />
  <!-- Clock hands -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="50" x2="65" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="50" r="3" fill="#1a1a1a" />
  <!-- Arrow 1 (top-right, going clockwise) -->
  <path d="M 78 22 C 88 35, 88 55, 78 78" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <polygon points="78,78 72,68 84,70" fill="#22c55e" />
  <!-- Arrow 2 (bottom-left, going clockwise) -->
  <path d="M 22 78 C 12 65, 12 45, 22 22" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <polygon points="22,22 28,32 16,30" fill="#22c55e" />
</svg>
